name: Build all

on:
  push:
    branches:
     - main
     - release/*
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - 'localization/**'
     - 'resources/**'
     - ".github/workflows/build_*.yml"
     - 'scripts/flatpak/**'

  pull_request:
    branches:
     - main
     - release/*
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - ".github/workflows/build_*.yml"
     - 'build_linux.sh'
     - 'build_release_vs2022.bat'
     - 'build_release_macos.sh'
     - 'scripts/flatpak/**'


  schedule:
      - cron: '0 17 * * *' # run once a day at 1 AM Singapore time (UTC+8)

  workflow_dispatch: # allows for manual dispatch
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false
      scope:
        description: 'CI scope to run'
        type: choice
        options:
          - full
          - ios-only
        default: full

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  

jobs:
  resolve_scope:
    name: Resolve CI Scope
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.resolve.outputs.scope }}
      run_desktop: ${{ steps.resolve.outputs.run_desktop }}
      run_ios: ${{ steps.resolve.outputs.run_ios }}
    steps:
      - name: Resolve workflow scope
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          scope="full"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ inputs.scope || 'full' }}"
          fi

          if [[ "${scope}" == "ios-only" ]]; then
            run_desktop="false"
            run_ios="true"
          else
            scope="full"
            run_desktop="true"
            run_ios="false"
          fi

          echo "scope=${scope}" >> "$GITHUB_OUTPUT"
          echo "run_desktop=${run_desktop}" >> "$GITHUB_OUTPUT"
          echo "run_ios=${run_ios}" >> "$GITHUB_OUTPUT"
          echo "Resolved CI scope: ${scope} (desktop=${run_desktop}, ios=${run_ios})"

  build_linux:
    needs: resolve_scope
    strategy:
      fail-fast: false
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && needs.resolve_scope.outputs.run_desktop == 'true' && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit
  build_windows:
    needs: resolve_scope
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && needs.resolve_scope.outputs.run_desktop == 'true' && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      build-deps-only: ${{ inputs.build-deps-only || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build_macos_arch:
    needs: resolve_scope
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && needs.resolve_scope.outputs.run_desktop == 'true' && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-14' }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build_macos_universal:
    name: Build macOS Universal
    needs:
      - resolve_scope
      - build_macos_arch
    if: ${{ !cancelled() && needs.resolve_scope.outputs.run_desktop == 'true' && needs.build_macos_arch.result == 'success' && !inputs.build-deps-only && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_orca.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-14' }}
      arch: universal
      macos-combine-only: true
    secrets: inherit

  publish_build_logs:
    name: Publish CI Build Logs
    runs-on: ubuntu-24.04
    needs:
      - resolve_scope
      - build_linux
      - build_windows
      - build_macos_arch
      - build_macos_universal
    if: ${{ !cancelled() && needs.resolve_scope.outputs.run_desktop == 'true' && github.event_name != 'pull_request' }}
    steps:
      - name: Download CI build log artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ci-build-logs-*
          path: ci-build-logs
          merge-multiple: true

      - name: Publish latest CI build logs to main branch folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: main
          PUBLISH_DIR: ci-logbook/build-latest
        shell: bash
        run: |
          set -euo pipefail

          if ! find ci-build-logs -type f -name '*.log' -print -quit >/dev/null 2>&1; then
            echo "No CI build logs found to publish."
            exit 0
          fi

          tmpdir="$(mktemp -d)"
          cleanup() { rm -rf "${tmpdir}"; }
          trap cleanup EXIT

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch "${TARGET_BRANCH}" "${REPO_URL}" "${tmpdir}/repo"

          mkdir -p "${tmpdir}/repo/${PUBLISH_DIR}"
          rsync -a --delete \
            --include='*/' \
            --include='*.log' \
            --exclude='*' \
            "ci-build-logs/" "${tmpdir}/repo/${PUBLISH_DIR}/"
          printf '%s\n' "${GITHUB_SHA}" > "${tmpdir}/repo/${PUBLISH_DIR}/source-commit.txt"

          pushd "${tmpdir}/repo" >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PUBLISH_DIR}"

          if git diff --cached --quiet; then
            echo "No CI build log changes to publish."
            exit 0
          fi

          git commit -m "Update CI build logs for ${GITHUB_SHA}"
          git push origin HEAD:"${TARGET_BRANCH}"
          popd >/dev/null

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs:
      - resolve_scope
      - build_linux
    if: ${{ !cancelled() && needs.resolve_scope.outputs.run_desktop == 'true' && needs.build_linux.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            scripts
            tests
      - name: Apt-Install Dependencies
        uses: ./.github/actions/apt-install-deps
      - name: Restore Test Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.sha }}-tests
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"  # use most recent 3.28.x version
      - name: Unpackage and Run Unit Tests
        timeout-minutes: 20
        run: |
          tar -xvf build_tests.tar
          scripts/run_unit_tests.sh
      - name: Upload Test Logs
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: unit-test-logs
          path: build/tests/**/*.log
      - name: Publish latest unit test logs to main branch folder
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: main
          PUBLISH_DIR: ci-logbook/unit-tests-latest
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          cleanup() { rm -rf "${tmpdir}"; }
          trap cleanup EXIT

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch "${TARGET_BRANCH}" "${REPO_URL}" "${tmpdir}/repo"

          mkdir -p "${tmpdir}/repo/${PUBLISH_DIR}"
          rsync -a --delete \
            --include='*/' \
            --include='*.log' \
            --exclude='*' \
            "build/tests/" "${tmpdir}/repo/${PUBLISH_DIR}/"
          printf '%s\n' "${GITHUB_SHA}" > "${tmpdir}/repo/${PUBLISH_DIR}/source-commit.txt"

          pushd "${tmpdir}/repo" >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PUBLISH_DIR}"

          if git diff --cached --quiet; then
            echo "No unit test log changes to publish."
            exit 0
          fi

          git commit -m "Update unit test logs for ${GITHUB_SHA}"
          git push origin HEAD:"${TARGET_BRANCH}"
          popd >/dev/null
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "ctest_results.xml"
  flatpak:
    name: "Flatpak"
    needs: resolve_scope
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
      volumes:
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
        - /opt/ghc:/opt/ghc1
        - /usr/local/share/boost:/usr/local/share/boost1
        - /opt/hostedtoolcache:/opt/hostedtoolcache1
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && needs.resolve_scope.outputs.run_desktop == 'true' && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    runs-on: ${{ matrix.variant.runner }}
    env:
      date:
      ver:
      ver_pure:
    steps:
    - name: "Remove unneeded stuff to free disk space"
      run:
        rm -rf /usr/local/lib/android/* /usr/share/dotnet/* /opt/ghc1/* "/usr/local/share/boost1/*" /opt/hostedtoolcache1/*
    - uses: actions/checkout@v6
    - name: Get the version and date
      run: |
        ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          ver="PR-${{ github.event.number }}"
          git_commit_hash="${{ github.event.pull_request.head.sha }}"
        else
          ver=V$ver_pure
          git_commit_hash="${{ github.sha }}"
        fi
        echo "ver=$ver" >> $GITHUB_ENV
        echo "ver_pure=$ver_pure" >> $GITHUB_ENV
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        echo "git_commit_hash=$git_commit_hash" >> $GITHUB_ENV
      shell: bash
    # Manage flatpak-builder cache externally so PRs restore but never upload
    - name: Restore flatpak-builder cache
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@v4
      with:
        path: .flatpak-builder
        key: flatpak-builder-${{ matrix.variant.arch }}-${{ github.event.pull_request.base.sha }}
        restore-keys: flatpak-builder-${{ matrix.variant.arch }}-
    - name: Save/restore flatpak-builder cache
      if: github.event_name != 'pull_request'
      uses: actions/cache@v4
      with:
        path: .flatpak-builder
        key: flatpak-builder-${{ matrix.variant.arch }}-${{ github.sha }}
        restore-keys: flatpak-builder-${{ matrix.variant.arch }}-
    - name: Disable debug info for faster CI builds
      run: |
        sed -i '/^build-options:/a\  no-debuginfo: true\n  strip: true' \
          scripts/flatpak/io.github.orcaslicer.OrcaSlicer.yml
      shell: bash
    - name: Inject git commit hash into Flatpak manifest
      run: |
        sed -i "/name: OrcaSlicer/{n;s|buildsystem: simple|buildsystem: simple\n    build-options:\n      env:\n        git_commit_hash: \"$git_commit_hash\"|}" \
          scripts/flatpak/io.github.orcaslicer.OrcaSlicer.yml
      shell: bash
    - uses: flatpak/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        manifest-path: scripts/flatpak/io.github.orcaslicer.OrcaSlicer.yml
        cache: false
        arch: ${{ matrix.variant.arch }}
        upload-artifact: false
    - name: Upload artifacts Flatpak
      uses: actions/upload-artifact@v6
      with:
        name: OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        path: '/__w/OrcaSlicer/OrcaSlicer/OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak'
    - name: Deploy Flatpak to nightly release
      if: github.repository == 'OrcaSlicer/OrcaSlicer' && github.ref == 'refs/heads/main'
      uses: WebFreak001/deploy-nightly@v3.2.0
      with:
        upload_url: https://uploads.github.com/repos/OrcaSlicer/OrcaSlicer/releases/137995723/assets{?name,label}
        release_id: 137995723
        asset_path: /__w/OrcaSlicer/OrcaSlicer/OrcaSlicer-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        asset_name: OrcaSlicer-Linux-flatpak_nightly_${{ matrix.variant.arch }}.flatpak
        asset_content_type: application/octet-stream
        max_releases: 1 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted

  ios_simulator_smoke:
    name: iOS simulator smoke
    needs: resolve_scope
    if: ${{ !cancelled() && needs.resolve_scope.outputs.run_ios == 'true' }}
    uses: ./.github/workflows/ios_simulator_smoke.yml
    secrets: inherit

  ios_ui_screenshot:
    name: iOS UI screenshot
    needs: resolve_scope
    if: ${{ !cancelled() && needs.resolve_scope.outputs.run_ios == 'true' }}
    uses: ./.github/workflows/ios_ui_screenshot.yml
    with:
      publish_latest_to_repo: true
    secrets: inherit

  ci_scope_summary:
    name: CI Scope Summary
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - resolve_scope
      - build_linux
      - build_windows
      - build_macos_arch
      - build_macos_universal
      - publish_build_logs
      - unit_tests
      - flatpak
      - ios_simulator_smoke
      - ios_ui_screenshot
    steps:
      - name: Validate scoped workflow results
        shell: bash
        run: |
          set -euo pipefail

          scope="${{ needs.resolve_scope.outputs.scope }}"
          echo "Resolved scope: ${scope}"

          check_result() {
            local job_name="$1"
            local job_result="$2"
            case "${job_result}" in
              success|skipped)
                echo "OK: ${job_name} -> ${job_result}"
                ;;
              *)
                echo "ERROR: ${job_name} -> ${job_result}"
                return 1
                ;;
            esac
          }

          if [[ "${scope}" == "ios-only" ]]; then
            check_result "ios_simulator_smoke" "${{ needs.ios_simulator_smoke.result }}"
            check_result "ios_ui_screenshot" "${{ needs.ios_ui_screenshot.result }}"
          else
            check_result "build_linux" "${{ needs.build_linux.result }}"
            check_result "build_windows" "${{ needs.build_windows.result }}"
            check_result "build_macos_arch" "${{ needs.build_macos_arch.result }}"
            check_result "build_macos_universal" "${{ needs.build_macos_universal.result }}"
            check_result "publish_build_logs" "${{ needs.publish_build_logs.result }}"
            check_result "unit_tests" "${{ needs.unit_tests.result }}"
            check_result "flatpak" "${{ needs.flatpak.result }}"
          fi

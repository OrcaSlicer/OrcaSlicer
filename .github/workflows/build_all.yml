name: Build all

on:
  push:
    branches:
      - main
      - release/*
    paths:
      - 'deps/**'
      - 'deps_src/**'
      - 'cmake/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - 'version.inc'
      - 'localization/**'
      - 'resources/**'
      - ".github/workflows/build_*.yml"
      - ".github/workflows/unit_tests*.yml"
      - 'build_linux.sh'
      - 'build_win.bat'
      - 'scripts/test_build_win.ps1'
      - 'scripts/check_exception_throw_info.ps1'
      - 'scripts/test_check_exception_throw_info.ps1'
      - 'build_release_macos.sh'
      - 'scripts/build_preset_cache.*'
      - 'scripts/prune_cached_presets.ps1'
      - 'scripts/test_prune_cached_presets.ps1'
      - 'scripts/flatpak/**'
      - 'scripts/msix/**'
      - 'tests/**'

  pull_request:
    branches:
      - main
      - release/*
    paths:
      - 'deps/**'
      - 'deps_src/**'
      - 'cmake/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - 'version.inc'
      - ".github/workflows/build_*.yml"
      - ".github/workflows/unit_tests*.yml"
      - 'build_linux.sh'
      - 'build_win.bat'
      - 'scripts/test_build_win.ps1'
      - 'scripts/check_exception_throw_info.ps1'
      - 'scripts/test_check_exception_throw_info.ps1'
      - 'build_release_macos.sh'
      - 'scripts/build_preset_cache.*'
      - 'scripts/prune_cached_presets.ps1'
      - 'scripts/test_prune_cached_presets.ps1'
      - 'scripts/flatpak/**'
      - 'scripts/msix/**'
      - 'tests/**'


  schedule:
      - cron: '15 2 * * *' # 10:15 AM Singapore time (UTC+8), when macOS runners are least busy

  workflow_dispatch: # allows for manual dispatch
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false
      clean-build:
        description: 'Remove the slicer build tree first, so each leg times a full build'
        type: boolean
        default: false

concurrency:
  # cancel_closed_pr_builds.yml joins this group by name, so update that file
  # with any change here.
  group: build-all-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Pushes don't cancel a running build, because only a finished branch build
  # saves caches every pull request can restore.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  

jobs:
  # build_win.bat ships a test suite. Run it before the Windows builds.
  check_build_script:
    name: Windows build script tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'false'

      # Windows PowerShell rather than pwsh: the suite drives build_win.bat
      # through cmd, and the two differ in how they quote native arguments.
      - name: Run the build script test suite
        timeout-minutes: 15
        shell: powershell
        run: .\scripts\test_build_win.ps1

      - name: Run the exception throw info check tests
        timeout-minutes: 5
        shell: powershell
        run: .\scripts\test_check_exception_throw_info.ps1

      - name: Run the preset prune tests
        timeout-minutes: 5
        shell: powershell
        run: .\scripts\test_prune_cached_presets.ps1

  build_windows:
    name: Build Windows ${{ matrix.arch }} (${{ matrix.preset }})${{ matrix.script == 'bat' && ' (baseline - current main)' || ' (candidate - ps1)' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            compiler: clang
            preset: x64-clang
            flags: -l -x
            script: ps1
          - arch: x64
            os: windows-latest
            compiler: clang
            preset: x64-clang
            flags: -l -x
            script: bat
    needs: check_build_script
    if: ${{ !cancelled() && needs.check_build_script.result == 'success' && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      compiler: ${{ matrix.compiler }}
      preset: ${{ matrix.preset }}
      flags: ${{ matrix.flags }}
      script: ${{ matrix.script }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      clean: ${{ inputs.clean-build || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build_macos_arch:
    # Disabled on fork: self-hosted macOS runner not available
    if: ${{ github.repository == 'OrcaSlicer/OrcaSlicer' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-15' }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build_macos_universal:
    # Disabled on fork: self-hosted macOS runner not available
    if: ${{ github.repository == 'OrcaSlicer/OrcaSlicer' }}
    name: Build macOS Universal
    uses: ./.github/workflows/build_orca.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-15' }}
      arch: universal
      macos-combine-only: true
    secrets: inherit
  build_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
            compiler: clang
            preset: x64-clang
            flags: -l -x
            script: ps1
    needs: check_build_script
    if: ${{ !cancelled() && needs.check_build_script.result == 'success' && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      compiler: ${{ matrix.compiler }}
      preset: ${{ matrix.preset }}
      flags: ${{ matrix.flags }}
      script: ${{ matrix.script }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      clean: ${{ inputs.clean-build || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  unit_tests_linux_aarch64:
    name: Linux aarch64
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ubuntu-24.04-arm
      artifact: ${{ github.sha }}-tests-linux-aarch64
  unit_tests_windows_x64_clang:
    name: Windows x64 (clang-cl + Ninja)
    needs: build_windows
    if: ${{ !cancelled() && success() }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-win-server' || 'windows-latest' }}
      artifact: ${{ github.sha }}-tests-windows-x64-x64-clang
  # macOS and ARM64 tests disabled on fork (no self-hosted runners available)
  # Re-enable on upstream: OrcaSlicer/OrcaSlicer
  # Slice a two-colour cube through every shipped printer, and through every
  # system process/filament whose templates no printer's own slice reaches, so
  # every custom g-code and filename_format shipped is expanded (names in {if}
  # branches not taken included) - catches slicing regressions the static
  # profile checks and unit tests can't see.
  # Profile-only PRs are covered by check_profiles.yml's nightly binary; this
  # covers src/engine PRs with the PR-built binary.
  slice_check_linux:
    # TEMPORARILY DISABLED: Windows-only testing
    if: false
    name: Slice check (Linux ${{ vars.SELF_HOSTED && 'x86_64' || 'aarch64' }})
    # Follows whichever Linux leg built the validator.
    runs-on: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download profile validator
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}-profile-validator-linux-${{ vars.SELF_HOSTED && 'x86_64' || 'aarch64' }}
          path: validator-bin
      - name: Validate slice (expand custom g-code)
        timeout-minutes: 60
        run: |
          chmod +x validator-bin/OrcaSlicer_profile_validator
          ./validator-bin/OrcaSlicer_profile_validator -p "${{ github.workspace }}/resources/profiles" -s -l 2
  publish_test_results:
    name: Publish Test Results
    needs: [unit_tests_windows_x64_clang]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Test Results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results
      # Best-effort: a read-only token (e.g. fork PRs) can't write the check, so
      # don't let a publish failure fail the run. The test jobs gate correctness.
      - name: Publish Test Results
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "test-results/**/*.xml"
      - name: Delete Test Results
        if: success()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: test-results-*
          failOnError: false
  flatpak:
    # Disabled on fork: requires specific container setup
    if: ${{ github.repository == 'OrcaSlicer/OrcaSlicer' }}
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
      volumes:
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
        - /opt/ghc:/opt/ghc1
        - /usr/local/share/boost:/usr/local/share/boost1
        - /opt/hostedtoolcache:/opt/hostedtoolcache1
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # Don't run scheduled builds on forks; skip entirely on self-hosted runners

    runs-on: ${{ matrix.variant.runner }}
    env:
      date:
      ver:
      ver_pure:
    steps:
    - name: "Remove unneeded stuff to free disk space"
      run:
        rm -rf /usr/local/lib/android/* /usr/share/dotnet/* /opt/ghc1/* "/usr/local/share/boost1/*" /opt/hostedtoolcache1/*
    - uses: actions/checkout@v7
    - name: Get the version and date
      run: |
        ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          ver="PR-${{ github.event.number }}"
          git_commit_hash="${{ github.event.pull_request.head.sha }}"
        else
          ver=V$ver_pure
          git_commit_hash="${{ github.sha }}"
        fi
        echo "ver=$ver" >> $GITHUB_ENV
        echo "ver_pure=$ver_pure" >> $GITHUB_ENV
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        echo "git_commit_hash=$git_commit_hash" >> $GITHUB_ENV
      shell: bash
    - name: Compute the flatpak-builder cache key
      id: fp_cache_key
      run: echo "key=flatpak-builder-${{ matrix.variant.arch }}-${{ hashFiles('deps/**', 'scripts/flatpak/com.orcaslicer.OrcaSlicer.yml', 'scripts/flatpak/make_deps_tar.sh') }}" >> "$GITHUB_OUTPUT"
      shell: bash
    # Manage flatpak-builder cache externally so PRs restore but never upload.
    # The compiler cache under it is keyed per run below, so it is left out.
    - name: Restore flatpak-builder cache
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@v6
      with:
        path: |
          .flatpak-builder/*
          !.flatpak-builder/ccache
        key: ${{ steps.fp_cache_key.outputs.key }}
        enableCrossOsArchive: false
    - name: Build flatpak
      timeout-minutes: 120
      run: |
        ./scripts/flatpak/com.orcaslicer.OrcaSlicer.yml
      shell: bash
    - name: Save flatpak-builder cache
      if: github.event_name == 'pull_request'
      uses: actions/cache/save@v6
      with:
        path: |
          .flatpak-builder/*
          !.flatpak-builder/ccache
        key: ${{ steps.fp_cache_key.outputs.key }}
        enableCrossOsArchive: false
    - name: Cleanup flatpak-builder
      run: rm -rf .flatpak-builder/build
  unit_tests_flatpak_x86_64:
    # TEMPORARILY DISABLED: Windows-only testing
    if: false
    name: Flatpak x86_64
    uses: ./.github/workflows/unit_tests_flatpak.yml
    with:
      os: ubuntu-24.04
      artifact: ${{ github.sha }}-flatpak-tests-x86_64
  unit_tests_flatpak_aarch64:
    # TEMPORARILY DISABLED: Windows-only testing
    if: false
    name: Flatpak aarch64
    uses: ./.github/workflows/unit_tests_flatpak.yml
    with:
      os: ubuntu-24.04-arm
      artifact: ${{ github.sha }}-flatpak-tests-aarch64
name: Backfill Duplicate Comments
description: Triggers duplicate detection for old issues that don't have duplicate comments

on:
  workflow_dispatch:
    inputs:
      min_issue_number:
        description: 'Lowest issue number to process'
        required: false
        default: '1'
        type: string
      max_issue_number:
        description: 'Only process issues below this number (empty for no upper bound); the previous run logs the value to continue from'
        required: false
        default: ''
        type: string
      limit:
        description: 'Maximum number of dedupe runs to start, one every 30 seconds'
        required: false
        default: '100'
        type: string
      dry_run:
        description: 'Dry run mode (true to only log what would be done)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  backfill-duplicate-comments:
    runs-on: ubuntu-latest
    # Dispatches are spaced 30 seconds apart, so a large limit runs for hours
    timeout-minutes: 360
    permissions:
      contents: read
      issues: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Backfill duplicate comments
        run: bun run scripts/backfill-duplicate-comments.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_ISSUE_NUMBER: ${{ inputs.min_issue_number }}
          MAX_ISSUE_NUMBER: ${{ inputs.max_issue_number }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
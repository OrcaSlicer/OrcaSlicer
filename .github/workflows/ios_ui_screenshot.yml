name: iOS UI Screenshot

on:
  workflow_dispatch:
    inputs:
      publish_latest_to_repo:
        description: 'Publish latest simulator screenshots to branch ios-ui-screenshot-latest'
        required: false
        type: boolean
        default: true
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - 'src/mobile/ios/**'
      - 'src/portability/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/ios_ui_screenshot.yml'
  push:
    branches:
      - main
      - release/*
    paths:
      - 'src/mobile/ios/**'
      - 'src/portability/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/ios_ui_screenshot.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ios_ui_screenshot:
    name: Build, launch, and screenshot OrcaSlicerIOS in Simulator
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - name: Setup CMake
        uses: lukka/get-cmake@v4.2.3
        with:
          cmakeVersion: "~3.28.0"

      - name: Select simulator runtime and device type
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY' > simulator-env.txt
          import json
          import subprocess

          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"]))["runtimes"]
          candidates = [
              r for r in runtimes
              if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS")
          ]
          if not candidates:
              raise SystemExit("No available iOS simulator runtimes found on runner")

          candidates.sort(key=lambda r: r.get("version", "0"))
          runtime_id = candidates[-1]["identifier"]

          devicetypes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "--json"]))["devicetypes"]
          preferred = ["iPhone 16", "iPhone 15", "iPhone 14"]
          device_type_id = None

          for name in preferred:
              for dt in devicetypes:
                  if dt.get("name") == name:
                      device_type_id = dt.get("identifier")
                      break
              if device_type_id:
                  break

          if not device_type_id:
              for dt in devicetypes:
                  if "iPhone" in dt.get("name", ""):
                      device_type_id = dt.get("identifier")
                      break

          if not device_type_id:
              raise SystemExit("No iPhone simulator device type found on runner")

          print(f"RUNTIME_ID={runtime_id}")
          print(f"DEVICE_TYPE_ID={device_type_id}")
          PY

          cat simulator-env.txt >> "$GITHUB_ENV"
          cat simulator-env.txt

      - name: Configure iOS simulator app build (Xcode generator)
        run: |
          cmake -S . -B build-ios-ui -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DORCASLICER_BUILD_IOS_PORTABILITY=ON \
            -DORCASLICER_BUILD_IOS_SMOKE_TARGET=ON \
            -DORCASLICER_BUILD_IOS_UI_SHELL=ON

      - name: Build OrcaSlicerIOS app target
        run: |
          cmake --build build-ios-ui --config Release --target OrcaSlicerIOS --parallel

      - name: Boot simulator, install app, and capture screenshot matrix
        env:
          APP_BUNDLE_ID: com.softfever3d.orcaslicer.ios
          SCREENSHOT_SETTLE_MS: "900"
        shell: bash
        run: |
          set -euo pipefail

          SCENES=(
            benchy-preview
            benchy-sliced
            root
            project
            tools
            slice-settings
            printer
            view
            app-settings
          )

          APP_BUNDLE="$(find build-ios-ui -type d -name OrcaSlicerIOS.app | head -n 1)"
          if [[ -z "${APP_BUNDLE}" || ! -d "${APP_BUNDLE}" ]]; then
            echo "Failed to locate OrcaSlicerIOS.app under build-ios-ui"
            find build-ios-ui -maxdepth 5 -type d -name '*.app' -print || true
            exit 1
          fi

          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP_BUNDLE}/Info.plist")"
          if [[ -z "${ACTUAL_BUNDLE_ID}" ]]; then
            echo "Could not read CFBundleIdentifier from ${APP_BUNDLE}/Info.plist"
            exit 1
          fi

          if [[ "${ACTUAL_BUNDLE_ID}" != "${APP_BUNDLE_ID}" ]]; then
            echo "Bundle identifier mismatch: expected ${APP_BUNDLE_ID}, got ${ACTUAL_BUNDLE_ID}"
            exit 1
          fi

          DEVICE_UDID="$(xcrun simctl create 'OrcaSlicerIOS CI' "${DEVICE_TYPE_ID}" "${RUNTIME_ID}")"
          echo "DEVICE_UDID=${DEVICE_UDID}" >> "$GITHUB_ENV"

          xcrun simctl boot "${DEVICE_UDID}"
          xcrun simctl bootstatus "${DEVICE_UDID}" -b
          xcrun simctl ui "${DEVICE_UDID}" appearance dark

          xcrun simctl install "${DEVICE_UDID}" "${APP_BUNDLE}"

          mkdir -p artifacts/ios-screenshots
          manifest="artifacts/ios-screenshots/manifest.txt"
          : > "${manifest}"

          for scene in "${SCENES[@]}"; do
            output="artifacts/ios-screenshots/${scene}.png"
            echo "[ios_ui_screenshot] launching scene=${scene} output=${output}"

            xcrun simctl terminate "${DEVICE_UDID}" "${APP_BUNDLE_ID}" >/dev/null 2>&1 || true

            LAUNCH_OUTPUT="$(SIMCTL_CHILD_ORCASLICER_IOS_SCREENSHOT_MODE=1 \
              SIMCTL_CHILD_ORCASLICER_IOS_SCREENSHOT_SCENE="${scene}" \
              SIMCTL_CHILD_ORCASLICER_IOS_SCREENSHOT_SETTLE_MS="${SCREENSHOT_SETTLE_MS}" \
              xcrun simctl launch --terminate-running-process "${DEVICE_UDID}" "${APP_BUNDLE_ID}" 2>&1)" || {
              echo "Failed to launch ${APP_BUNDLE_ID} for scene=${scene}"
              echo "${LAUNCH_OUTPUT}"
              exit 1
            }

            echo "${LAUNCH_OUTPUT}"
            sleep 2

            xcrun simctl io "${DEVICE_UDID}" screenshot "${output}"

            if [[ ! -s "${output}" ]]; then
              echo "Screenshot missing or empty for scene=${scene}: ${output}"
              exit 1
            fi

            echo "${scene} ${output}" | tee -a "${manifest}"
          done

      - name: Upload iOS UI screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-screenshot
          path: artifacts/ios-screenshots/
          if-no-files-found: error

      - name: Publish latest screenshots to repository branch
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish_latest_to_repo) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: ios-ui-screenshot-latest
          PUBLISH_DIR: ios-ui-screenshot/latest
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          cleanup() { rm -rf "${tmpdir}"; }
          trap cleanup EXIT

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "${REPO_URL}" "${PUBLISH_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${PUBLISH_BRANCH}" "${REPO_URL}" "${tmpdir}/repo"
          else
            git clone --depth 1 "${REPO_URL}" "${tmpdir}/repo"
            pushd "${tmpdir}/repo" >/dev/null
            git checkout --orphan "${PUBLISH_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            popd >/dev/null
          fi

          mkdir -p "${tmpdir}/repo/${PUBLISH_DIR}"
          rsync -a --delete "artifacts/ios-screenshots/" "${tmpdir}/repo/${PUBLISH_DIR}/"
          printf '%s\n' "${GITHUB_SHA}" > "${tmpdir}/repo/${PUBLISH_DIR}/source-commit.txt"

          pushd "${tmpdir}/repo" >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PUBLISH_DIR}"

          if git diff --cached --quiet; then
            echo "No screenshot changes to publish."
            exit 0
          fi

          git commit -m "Update iOS UI screenshots for ${GITHUB_SHA}"
          git push origin HEAD:"${PUBLISH_BRANCH}"
          popd >/dev/null

      - name: Cleanup simulator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DEVICE_UDID:-}" ]]; then
            xcrun simctl shutdown "${DEVICE_UDID}" || true
            xcrun simctl delete "${DEVICE_UDID}" || true
          fi

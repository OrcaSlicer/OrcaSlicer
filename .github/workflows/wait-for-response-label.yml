name: Wait for response label

on:
  schedule:
    - cron: "7-57/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read # read when each commit was pushed

concurrency:
  group: wait-for-response-label

jobs:
  label:
    if: github.repository == 'OrcaSlicer/OrcaSlicer'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: raistlin7447/waiting-on-author@3686b1acc23f3904ffbacef48bec68d48acfc5fb # v1.0.0
        with:
          provider: claude
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label: wait for response
          command-prefix: /bot
          dry-run: false

name: Check CAD offer table

# src/slic3r/GUI/CAD/DesignOffer.hpp is generated from scripts/CAD/tool_atlas.json and must never be
# edited by hand. This fails when the checked-in header is not what the generator makes of the atlas.
on:
  push:
    paths:
    - 'scripts/CAD/tool_atlas.json'
    - 'scripts/CAD/gen_offer_table.py'
    - 'src/slic3r/GUI/CAD/DesignOffer.hpp'
    - '.github/workflows/check_cad_offer_table.yml'
  pull_request:
    paths:
    - 'scripts/CAD/tool_atlas.json'
    - 'scripts/CAD/gen_offer_table.py'
    - 'src/slic3r/GUI/CAD/DesignOffer.hpp'
    - '.github/workflows/check_cad_offer_table.yml'

permissions: {}

jobs:
  check_cad_offer_table:
    name: Check CAD offer table
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the offer table against the atlas
        run: python3 scripts/CAD/gen_offer_table.py --check

on:
    workflow_call:
      inputs:
        cache-key:
          required: false
          type: string
        cache-path:
          required: false
          type: string
        os:
          required: true
          type: string
        arch:
          required: false
          type: string
        compiler:
          required: false
          type: string
          default: msvc
        macos-combine-only:
          required: false
          type: boolean
          default: false
        ai-commercial-package:
          required: false
          type: boolean
          default: false

jobs:
  build_orca:
    name: Build OrcaSlicer
    runs-on: ${{ inputs.os }}
    # Internal validation builds use no publication or signing credentials.
    env:
      date:
      ver:
      ver_pure:
      ubuntu-ver: '2404'
      ubuntu-ver-str: '_Ubuntu2404'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      - name: load cached deps
        if: ${{ !(runner.os == 'macOS' && inputs.macos-combine-only) }}
        uses: actions/cache@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - uses: lukka/get-cmake@latest
        # The windows-11-arm runner needs CMake <= 3.31 (handled in the next step).
        if: ${{ !(runner.os == 'Windows' && inputs.arch == 'arm64') }}
        with:
          cmakeVersion: "~4.3.0"  # use most recent 4.3.x version
          useLocalCache: true         # <--= Use the local cache (default is 'false').
          useCloudCache: true

      - name: Install CMake 3.31.x (Windows ARM64)
        # windows-11-arm ships CMake 4.x, which removed pre-3.5 policy
        # compatibility AND has incomplete ASM_ARMASM linker modules
        # (breaks Boost.Context on ARM64). Pin to the last 3.x release.
        if: runner.os == 'Windows' && inputs.arch == 'arm64'
        shell: pwsh
        run: |
          $ver = "3.31.6"
          $url = "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-arm64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\cmake.zip" -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          $cmakeBin = "$env:RUNNER_TEMP\cmake\cmake-$ver-windows-arm64\bin"
          if (-not (Test-Path "$cmakeBin\cmake.exe")) { throw "cmake.exe not found at $cmakeBin" }
          Add-Content -Path $env:GITHUB_PATH -Value $cmakeBin

      - name: Get the version and date on Ubuntu and macOS
        if: runner.os != 'Windows'
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
            git_commit_hash="${{ github.event.pull_request.head.sha }}"
          else
            ver=V$ver_pure
            git_commit_hash=""
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "git_commit_hash=$git_commit_hash" >> $GITHUB_ENV
          # Per-arch Linux AppImage naming: amd64 keeps the historical unsuffixed
          # name (arch_suffix empty). Unused on macOS/Windows.
          if [ '${{ inputs.arch }}' = 'aarch64' ]; then
            echo "arch_suffix=_aarch64" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Get the version and date on Windows
        if: runner.os == 'Windows'
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
              $git_commit_hash = "${{ github.event.pull_request.head.sha }}"
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(SoftFever_VERSION "(.*?)"\)') {
                  $ver = $matches[1]
              }
              $ver = "V$ver"
              $git_commit_hash = ""
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "git_commit_hash=$git_commit_hash" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

#   Mac
      - name: Install tools mac
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        run: |
          if [ "${{ startsWith(inputs.os, 'orca-') }}" != "true" ]; then
            brew install libtool
            brew list
          fi
          mkdir -p ${{ github.workspace }}/deps/build/${{ inputs.arch }}

      - name: Free disk space
        if: runner.os == 'macOS' && !inputs.macos-combine-only && !startsWith(inputs.os, 'orca-')
        run: |
          df -hI /dev/disk3s1s1
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -hI /dev/disk3s1s1

      - name: Build slicer mac
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        # arm64 only: build the tests here; the unit_tests_macos job runs them.
        env:
          ORCA_TESTS_BUILD_ONLY: ${{ inputs.arch == 'arm64' && '1' || '' }}
        run: |
          ./build_release_macos.sh -s -n -x ${{ !startsWith(inputs.os, 'orca-') && '-j 3' || '' }} -a ${{ inputs.arch }} -t 10.15 ${{ inputs.arch == 'arm64' && '-T' || '' }}

      - name: Pack unit tests mac
        if: runner.os == 'macOS' && !inputs.macos-combine-only && inputs.arch == 'arm64'
        working-directory: ${{ github.workspace }}
        run: tar -cvf build_tests.tar build/arm64/tests

      - name: Upload Test Artifact mac
        if: runner.os == 'macOS' && !inputs.macos-combine-only && inputs.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-tests-macos-arm64
          overwrite: true
          path: build_tests.tar
          retention-days: 5
          if-no-files-found: error

      - name: Build system preset cache (macOS)
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        shell: bash
        # The bundle was already packed from resources/, so the caches have to be
        # installed into it here; the source tree keeps its JSONs for later jobs.
        run: ./scripts/build_preset_cache.sh -b build/${{ inputs.arch }} build/${{ inputs.arch }}/OrcaSlicer/OrcaSlicer.app/Contents/Resources/profiles

      - name: Pack macOS app bundle ${{ inputs.arch }}
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          tar -czvf OrcaSlicer_Mac_bundle_${{ inputs.arch }}_${{ github.sha }}.tar.gz -C build/${{ inputs.arch }} OrcaSlicer

      - name: Upload macOS app bundle ${{ inputs.arch }}
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Mac_bundle_${{ inputs.arch }}_${{ github.sha }}
          path: ${{ github.workspace }}/OrcaSlicer_Mac_bundle_${{ inputs.arch }}_${{ github.sha }}.tar.gz

      - name: Download macOS app bundles
        if: runner.os == 'macOS' && inputs.macos-combine-only
        uses: actions/download-artifact@v8
        with:
          pattern: OrcaSlicer_Mac_bundle_*_${{ github.sha }}
          path: ${{ github.workspace }}/mac_bundles

      - name: Extract macOS app bundles
        if: runner.os == 'macOS' && inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p build/arm64 build/x86_64
          arm_bundle=$(find "${{ github.workspace }}/mac_bundles/OrcaSlicer_Mac_bundle_arm64_${{ github.sha }}" -name '*.tar.gz' -print -quit)
          x86_bundle=$(find "${{ github.workspace }}/mac_bundles/OrcaSlicer_Mac_bundle_x86_64_${{ github.sha }}" -name '*.tar.gz' -print -quit)
          tar -xzvf "$arm_bundle" -C "${{ github.workspace }}/build/arm64"
          tar -xzvf "$x86_bundle" -C "${{ github.workspace }}/build/x86_64"

      - name: Build universal mac app bundle
        if: runner.os == 'macOS' && inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          ./build_release_macos.sh -u -x ${{ !startsWith(inputs.os, 'orca-') && '-j 3' || '' }} -a universal -t 10.15

      - name: Create DMG without notary
        if: runner.os == 'macOS' && inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          # Load the `retry` helper (retries flaky commands such as `hdiutil create`).
          source ${{ github.workspace }}/scripts/retry.sh
          mkdir -p ${{ github.workspace }}/build/universal/OrcaSlicer_dmg
          rm -rf ${{ github.workspace }}/build/universal/OrcaSlicer_dmg/*
          cp -R ${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer.app ${{ github.workspace }}/build/universal/OrcaSlicer_dmg/
          ln -sfn /Applications ${{ github.workspace }}/build/universal/OrcaSlicer_dmg/Applications
          retry hdiutil create -volname "OrcaSlicer" -srcfolder ${{ github.workspace }}/build/universal/OrcaSlicer_dmg -ov -format UDZO OrcaSlicer_Mac_universal_${{ env.ver }}.dmg
          
          # Create separate OrcaSlicer_profile_validator DMG if the app exists
          if [ -f "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            mkdir -p ${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg
            rm -rf ${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg/*
            cp -R ${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app ${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg/
            ln -sfn /Applications ${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg/Applications
            retry hdiutil create -volname "OrcaSlicer Profile Validator" -srcfolder ${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg -ov -format UDZO OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg
          fi

      # Delete the per-arch bundles only after DMG creation succeeded, so a
      # failed run keeps them available for a re-run instead of forcing a full rebuild.
      - name: Delete intermediate per-arch artifacts
        if: success() && runner.os == 'macOS' && inputs.macos-combine-only
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            OrcaSlicer_Mac_bundle_arm64_${{ github.sha }}
            OrcaSlicer_Mac_bundle_x86_64_${{ github.sha }}

      - name: Upload artifacts mac
        if: runner.os == 'macOS' && inputs.macos-combine-only
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Mac_universal_${{ env.ver }}
          path: ${{ github.workspace }}/OrcaSlicer_Mac_universal_${{ env.ver }}.dmg

      - name: Upload OrcaSlicer_profile_validator DMG mac
        if: runner.os == 'macOS' && inputs.macos-combine-only && !startsWith(inputs.os, 'orca-')
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_profile_validator_Mac_universal_DMG_${{ env.ver }}
          path: ${{ github.workspace }}/OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg
          if-no-files-found: ignore

# Windows
      - name: Set Windows build variables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ inputs.arch }}" -eq "arm64") {
            "BUILD_DIR=build-arm64"  | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            "ARCH_SUFFIX=_arm64"     | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          } else {
            "BUILD_DIR=build"        | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            "ARCH_SUFFIX=_x64"       | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          }

      - name: setup MSVC
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Install nsis
        if: runner.os == 'Windows' && !startsWith(inputs.os, 'orca-')
        run: |
          dir "C:/Program Files (x86)/Windows Kits/10/Include"
          choco install nsis

      - name: Build slicer Win
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        # Orca: Removed Netfabb STL fixing service support in favor of CGAL.
        # env:
        #   WindowsSdkDir: 'C:\Program Files (x86)\Windows Kits\10\'
        #   WindowsSDKVersion: '10.0.26100.0\'
        # "tests" builds the unit tests too; the unit_tests_windows_* jobs run them.
        env:
          ORCA_AI_WINDOWS_INSTALLER: ${{ inputs.ai-commercial-package && 'ON' || 'OFF' }}
          ORCA_AI_DISTRIBUTION_CHANNEL: commercial
          ORCA_AI_PACKAGE_REVISION: ci-${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $arch = "${{ inputs.arch }}"
          # -l selects clang-cl and -x Ninja; together they build the slicer with clang.
          $clang = "${{ inputs.compiler }}" -eq "clang"
          $flags = if ($clang) { "-l", "-x" } else { @() }
          if ($clang) {
            # Build against the same VC toolchain and SDK as the dependencies.
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -property installationPath
            $devArch = if ($arch -eq "arm64") { "arm64" } else { "amd64" }
            Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
            Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$devArch"
          }
          if ($arch -eq "arm64") { .\build_release_vs.bat slicer arm64 @flags tests } else { .\build_release_vs.bat slicer @flags tests }
        shell: pwsh

      - name: Verify commercial AI runtime identity
        if: runner.os == 'Windows' && inputs.ai-commercial-package
        shell: pwsh
        run: |
          $expectedCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $expectedCommit -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'Unable to resolve the exact checked-out source commit.'
          }
          $runtimeRoot = Join-Path '${{ env.BUILD_DIR }}' 'OrcaSlicer/resources/tools/ai'
          $buildInfoPath = Join-Path $runtimeRoot 'orca_ai_build_info.json'
          $runtimeDependenciesPath = Join-Path $runtimeRoot 'orca_ai_runtime_dependencies.json'
          if (-not (Test-Path -LiteralPath $buildInfoPath -PathType Leaf)) {
            throw "Commercial AI build identity is missing: $buildInfoPath"
          }
          if (-not (Test-Path -LiteralPath $runtimeDependenciesPath -PathType Leaf)) {
            throw "Commercial AI dependency metadata is missing: $runtimeDependenciesPath"
          }
          $buildInfo = Get-Content -LiteralPath $buildInfoPath -Raw | ConvertFrom-Json
          $runtimeDependencies = Get-Content -LiteralPath $runtimeDependenciesPath -Raw | ConvertFrom-Json
          if ($buildInfo.schema_version -ne 1 -or
              $buildInfo.application_commit -ne $expectedCommit -or
              $buildInfo.distribution_channel -ne 'commercial' -or
              $buildInfo.sidecar_protocol_version -ne 2 -or
              $buildInfo.sidecar_version -ne 'orcaslicer-ai-sidecar-v9') {
            throw 'Commercial AI build identity does not match the checked-out source and runtime contract.'
          }
          foreach ($required in @(
              'orca_ai_installed_bootstrap.py', 'orca_ai_sidecar.py', 'network_policy.py',
              'openai_preprocessor.py', 'tripo_client.py', 'verify_bundled_runtime.py')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtimeRoot $required) -PathType Leaf)) {
              throw "Commercial AI runtime file is missing: $required"
            }
          }
          $expectedArchitecture = if ('${{ inputs.arch }}' -eq 'arm64') { 'arm64' } else { 'x64' }
          $expectedPillowHash = if ($expectedArchitecture -eq 'arm64') {
            'af73337013e0b3b46f175e79492d96845b16126ddf79c438d7ea7ff27783a414'
          } else {
            '7f84204dee22a783350679a0333981df803dac21a0190d706a50475e361c93f5'
          }
          $pillowDependency = @($runtimeDependencies.packages) |
            Where-Object { $_.name -eq 'Pillow' } |
            Select-Object -First 1
          if ($runtimeDependencies.schema_version -ne 1 -or
              $runtimeDependencies.python.version -ne '3.12.13' -or
              $runtimeDependencies.python.isolation_flag -ne '-I' -or
              -not $pillowDependency -or
              $pillowDependency.version -ne '12.2.0' -or
              $pillowDependency.architecture -ne $expectedArchitecture -or
              $pillowDependency.sha256 -ne $expectedPillowHash) {
            throw 'Commercial AI dependency metadata does not match the pinned Python/Pillow runtime.'
          }
          $installedPythonRoot = Join-Path '${{ env.BUILD_DIR }}' 'OrcaSlicer/python'
          $installedPython = Join-Path $installedPythonRoot 'python.exe'
          if (-not (Test-Path -LiteralPath $installedPython -PathType Leaf)) {
            throw "Commercial AI bundled Python is missing: $installedPython"
          }
          $runtimeProbeJson = & $installedPython -I (Join-Path $runtimeRoot 'verify_bundled_runtime.py') `
            --python-root $installedPythonRoot --expect-python 3.12.13 --expect-pillow 12.2.0 --json
          if ($LASTEXITCODE -ne 0) {
            throw 'Commercial AI bundled Python could not import Pillow in isolated mode.'
          }
          $runtimeProbe = $runtimeProbeJson | ConvertFrom-Json
          if ($runtimeProbe.schema_version -ne 1 -or $runtimeProbe.python_version -ne '3.12.13' -or
              $runtimeProbe.pillow_version -ne '12.2.0' -or $runtimeProbe.native_png_roundtrip -ne $true) {
            throw 'Commercial AI Python/Pillow versions or module origin do not match the isolated install tree.'
          }
          if (Get-ChildItem -LiteralPath '${{ env.BUILD_DIR }}/OrcaSlicer' -Recurse -File |
              Where-Object Name -eq 'orca_ai_internal_defaults.json') {
            throw 'Commercial package must not contain package-only provider credentials.'
          }
          $manifest = [ordered]@{
            schema_version = 1
            source_commit = $expectedCommit
            architecture = $expectedArchitecture
            application_version = $buildInfo.application_version
            package_revision = $buildInfo.package_revision
            distribution_channel = $buildInfo.distribution_channel
            sidecar_protocol_version = $buildInfo.sidecar_protocol_version
            sidecar_version = $buildInfo.sidecar_version
            python_version = $runtimeProbe.python_version
            pillow_version = $runtimeProbe.pillow_version
            runtime_dependencies = $runtimeDependencies
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath '${{ env.BUILD_DIR }}/commercial-ai-build-manifest.json' -Encoding utf8

      - name: Upload commercial AI build manifest
        if: runner.os == 'Windows' && inputs.ai-commercial-package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-commercial-ai-manifest-${{ inputs.arch }}
          path: ${{ env.BUILD_DIR }}/commercial-ai-build-manifest.json
          retention-days: 14
          if-no-files-found: error

      - name: Build system preset cache (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # Shipped into both the already-installed tree (portable zip, MSIX) and
        # the checkout cpack re-installs from when it builds the NSIS installer.
        run: scripts\build_preset_cache.bat --prune-source "%BUILD_DIR%" "resources\profiles" "%BUILD_DIR%\OrcaSlicer\resources\profiles"

      - name: Pack unit tests Win
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: tar -cvf build_tests.tar ${{ env.BUILD_DIR }}/tests

      - name: Upload Test Artifact Win
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-tests-windows-${{ inputs.arch }}
          overwrite: true
          path: build_tests.tar
          retention-days: 5
          if-no-files-found: error

      # NSIS is x86-only; it runs (and the installer it emits runs) under ARM64's
      # x86 emulation, packaging the native arm64 payload from build-arm64.
      - name: Create installer Win
        if: runner.os == 'Windows' && !startsWith(inputs.os, 'orca-')
        working-directory: ${{ github.workspace }}/${{ env.BUILD_DIR }}
        run: |
          cpack -G NSIS

      - name: Pack app
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/${{ env.BUILD_DIR }}
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip OrcaSlicer_Windows_${{ env.ver }}${{ env.ARCH_SUFFIX }}_portable.zip ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer'

      - name: Pack PDB
        if: runner.os == 'Windows' && inputs.arch != 'arm64' && !startsWith(inputs.os, 'orca-')
        working-directory: ${{ github.workspace }}/${{ env.BUILD_DIR }}/src/Release
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -m0=lzma2 -mx9 Debug_PDB_${{ env.ver }}_for_developers_only.7z  *.pdb'

      - name: Upload artifacts Win zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Windows_${{ env.ver }}${{ env.ARCH_SUFFIX }}_portable
          path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer

      - name: Upload artifacts Win installer
        if: runner.os == 'Windows' && !startsWith(inputs.os, 'orca-')
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Windows_${{ env.ver }}${{ env.ARCH_SUFFIX }}
          path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer*.exe

      - name: Upload artifacts Win PDB
        if: runner.os == 'Windows' && inputs.arch != 'arm64' && !startsWith(inputs.os, 'orca-')
        uses: actions/upload-artifact@v7
        with:
          name: PDB
          path: ${{ github.workspace }}/build/src/Release/Debug_PDB_${{ env.ver }}_for_developers_only.7z

      - name: Upload OrcaSlicer_profile_validator Win
        if: runner.os == 'Windows' && inputs.arch != 'arm64' && !startsWith(inputs.os, 'orca-')
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_profile_validator_Windows_${{ env.ver }}
          path: ${{ github.workspace }}/build/src/Release/OrcaSlicer_profile_validator.exe

      - name: Build MSIX Store package Win
        if: runner.os == 'Windows' && !startsWith(inputs.os, 'orca-')
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          ./scripts/msix/build_msix.ps1 `
            -InstallDir "${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer" `
            -OutputPath "${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_MSIX_${{ env.ver }}${{ env.ARCH_SUFFIX }}.msix" `
            -Architecture "${{ inputs.arch }}" `
            -IdentityName "${{ vars.ORCA_MSIX_IDENTITY_NAME || 'OrcaSlicer.OrcaSlicer' }}" `
            -Publisher "${{ vars.ORCA_MSIX_PUBLISHER || 'CN=38F7EA55-C73B-4072-B3B2-C8E0EA15BB82' }}" `
            -PublisherDisplayName "${{ vars.ORCA_MSIX_PUBLISHER_DISPLAY_NAME || 'OrcaSlicer' }}"

      - name: Upload artifacts Win MSIX
        if: runner.os == 'Windows' && !startsWith(inputs.os, 'orca-')
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Windows_MSIX_${{ env.ver }}${{ env.ARCH_SUFFIX }}
          path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_MSIX_${{ env.ver }}${{ env.ARCH_SUFFIX }}.msix

# Ubuntu
      - name: Apt-Install Dependencies
        if: runner.os == 'Linux' && !startsWith(inputs.os, 'orca-')
        uses: ./.github/actions/apt-install-deps

        # Tests must built at the same time as the slicer;
        # if you untangle them feel free to separate them here too
      - name: Build slicer and tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Build + tar the unit tests (-t) on both Linux legs so each arch
          # (x86_64 + aarch64) gets tested by its own unit_tests_linux_* job.
          ./build_linux.sh -istrlL
          ./scripts/check_appimage_libs.sh ./build/package ./build/package/bin/orca-slicer
          appimage=./build/OrcaSlicer_Linux_AppImage${{ env.ubuntu-ver-str }}${{ env.arch_suffix }}_${{ env.ver }}.AppImage
          mv -n ./build/OrcaSlicer_Linux_V${{ env.ver_pure }}.AppImage "$appimage"
          chmod +x "$appimage"
          tar -cvf build_tests.tar build/tests

        # Use tar because upload-artifacts won't always preserve directory structure
        # and doesn't preserve file permissions
      - name: Upload Test Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-tests-linux-${{ inputs.arch == 'aarch64' && 'aarch64' || 'x86_64' }}
          overwrite: true
          path: build_tests.tar
          retention-days: 5
          if-no-files-found: error

      - name: Build system preset cache (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Both were packed from resources/ before the caches existed, so the
          # AppImage is unpacked first and the caches shipped into it and into
          # the package tree; the source tree keeps its JSONs for later steps.
          appimage=$(find build -maxdepth 1 -name "OrcaSlicer_Linux_AppImage*.AppImage" | head -1)
          chmod +x "$appimage"
          "$appimage" --appimage-extract
          ./scripts/build_preset_cache.sh -b build build/package/resources/profiles squashfs-root/resources/profiles
          appimagetool=$(find build -name "appimagetool.AppImage" | head -1)
          ARCH=$(uname -m) "$appimagetool" --appimage-extract-and-run squashfs-root "$appimage"
          rm -rf squashfs-root
        # Ship the freshly-built validator so slice_check_linux (build_all.yml)
        # can slice-sweep the shipped profiles with this PR's engine. Taken from
        # the aarch64 leg so the sweep also exercises the arm build; x86_64 on
        # SELF_HOSTED, which skips arm64.
      - name: Upload profile validator (for slice check)
        if: ${{ runner.os == 'Linux' && (startsWith(inputs.os, 'orca-') && inputs.arch != 'aarch64' || !startsWith(inputs.os, 'orca-') && inputs.arch == 'aarch64') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-profile-validator-linux-${{ inputs.arch == 'aarch64' && 'aarch64' || 'x86_64' }}
          overwrite: true
          path: ./build/src/Release/OrcaSlicer_profile_validator
          retention-days: 5
          if-no-files-found: error

      - name: Run external slicer regression tests
        if: runner.os == 'Linux' && inputs.arch != 'aarch64'
        timeout-minutes: 20
        shell: bash
        run: |
          test_repo_dir="${{ runner.temp }}/orca-test-repo"
          rm -rf "$test_repo_dir"
          git clone --depth 1 https://github.com/OrcaSlicer/orca-test-repo.git "$test_repo_dir"
          python3 "$test_repo_dir/run_test.py" "${{ github.workspace }}/build/package/bin/orca-slicer"

      - name: Build orca_custom_preset_tests
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux' && !startsWith(inputs.os, 'orca-') && inputs.arch != 'aarch64'
        working-directory: ${{ github.workspace }}/build/src/Release
        shell: bash
        run: |
          ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -g 1
          cd ${{ github.workspace }}/resources/profiles
          zip -r orca_custom_preset_tests.zip user/

      - name: Upload artifacts Ubuntu
        if: ${{ ! env.ACT && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Linux_ubuntu_${{ env.ubuntu-ver }}${{ env.arch_suffix }}_${{ env.ver }}
          path: "./build/OrcaSlicer_Linux_AppImage${{ env.ubuntu-ver-str }}${{ env.arch_suffix }}_${{ env.ver }}.AppImage"

      - name: Upload OrcaSlicer_profile_validator Ubuntu
        if: ${{ ! env.ACT && runner.os == 'Linux' && !startsWith(inputs.os, 'orca-') && inputs.arch != 'aarch64' }}
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_profile_validator_Linux_ubuntu_${{ env.ubuntu-ver }}_${{ env.ver }}
          path: './build/src/Release/OrcaSlicer_profile_validator'

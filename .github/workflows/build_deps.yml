on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-prefix:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      valid-cache:
        required: true
        type: boolean
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      compiler:
        required: false
        type: string
        default: msvc
      preset:
        required: false
        type: string
      flags:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean
      force-build:
        required: false
        type: boolean
      script:
        required: false
        type: string
        default: ps1
      clean:
        required: false
        type: boolean
        default: false

jobs:
  build_deps:
    name: Build Deps
    if: ${{ !cancelled() && (inputs.build-deps-only || inputs.force-build || inputs.valid-cache != true) }}
    runs-on: ${{ inputs.os }}
    env:
      date:
    steps:

      # Setup the environment
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      # A reused self-hosted workspace keeps .git/info/sparse-checkout from an earlier
      # job, so the checkout above only materialises those paths. Clear it and expand
      # the working tree, or build_win.ps1's dot-sourced steps are missing.
      - name: Disable stale sparse-checkout
        continue-on-error: true
        run: git sparse-checkout disable

      # actions/cache archives with `tar -z`, which shells out to gzip, and the runner
      # service PATH has none. Copying gzip alone keeps Git's usr/bin off PATH: that
      # directory also holds a cygwin perl, which OpenSSL's Configure rejects.
      - name: Put gzip on PATH for the cache archive
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $src = Join-Path $env:ProgramFiles 'Git\usr\bin'
          $dst = Join-Path $env:RUNNER_TEMP 'cache-gzip'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          foreach ($f in 'gzip.exe', 'msys-2.0.dll') {
            $p = Join-Path $src $f
            if (Test-Path $p) { Copy-Item $p $dst -Force }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dst

      - name: load cached deps
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          restore-keys: ${{ inputs.cache-prefix }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"  # use most recent 4.3.x version
          useLocalCache: true         # <--= Use the local cache (default is 'false').
          useCloudCache: true

      - name: setup dev on Windows
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Get the date on Ubuntu and macOS
        if: runner.os != 'Windows'
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Get the date on Windows
        if: runner.os == 'Windows'
        run: echo "date=$(Get-Date -Format 'yyyyMMdd')" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
        shell: powershell


      - name: Install MSYS2 (clangarm64) with GMP/MPFR and LLVM tools
        if: runner.os == 'Windows' && inputs.arch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-gmp
            mingw-w64-clang-aarch64-mpfr
            mingw-w64-clang-aarch64-llvm

      - name: Stage ARM64 GMP/MPFR (no prebuilt blobs exist for win-arm64)
        # GMP/MPFR ship prebuilt x64/x86 blobs in-tree but none for ARM64.
        # Pull them from MSYS2 clangarm64 and generate MSVC import libs via
        # llvm-dlltool, then stage into deps/{GMP,MPFR}/.../win-arm64 where the
        # MSVC branch of GMP.cmake/MPFR.cmake copies them into the dep prefix.
        if: runner.os == 'Windows' && inputs.arch == 'arm64'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BIN=/clangarm64/bin
          REPO=$(cygpath -u "$GITHUB_WORKSPACE")

          make_import_lib() {
            local dll="$1"; local lib="$2"; local def="/tmp/${dll%.dll}.def"
            echo "EXPORTS" > "$def"
            llvm-readobj --coff-exports "$BIN/$dll" | awk '/Name: /{print $2}' >> "$def"
            llvm-dlltool -m arm64 -D "$dll" -d "$def" -l "$BIN/$lib"
          }

          make_import_lib libgmp-10.dll libgmp-10.lib

          # MPFR 4.x ships as libmpfr-6.dll; rename to libmpfr-4 BEFORE generating
          # the import lib so the baked-in runtime DLL name is correct.
          MPFR_DLL=$(ls $BIN/libmpfr-*.dll | head -1 | xargs basename)
          if [ "$MPFR_DLL" != "libmpfr-4.dll" ]; then cp "$BIN/$MPFR_DLL" "$BIN/libmpfr-4.dll"; fi
          make_import_lib libmpfr-4.dll libmpfr-4.lib

          mkdir -p $REPO/deps/GMP/gmp/lib/win-arm64 $REPO/deps/MPFR/mpfr/lib/win-arm64
          cp $BIN/libgmp-10.dll $BIN/libgmp-10.lib $REPO/deps/GMP/gmp/lib/win-arm64/
          cp $BIN/libmpfr-4.dll $BIN/libmpfr-4.lib $REPO/deps/MPFR/mpfr/lib/win-arm64/
          cp /clangarm64/include/gmp.h  $REPO/deps/GMP/gmp/include/
          cp /clangarm64/include/mpfr.h $REPO/deps/MPFR/mpfr/include/ || true

      # Build Dependencies
      - name: Build on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: |
            Write-Host "Workspace path: ${{ github.workspace }}"
            Get-ChildItem ${{ github.workspace }} | Format-Table
            # Strawberry Perl is required by OpenSSL's Configure. Git for Windows
            # ships a cygwin perl that shadows Strawberry Perl on PATH, so we
            # explicitly prepend Strawberry's bins after installing. Chocolatey
            # has permission issues on this self-hosted runner, so download the
            # portable zip directly and extract to the runner temp dir (C: is
            # not writable on this runner).
            $spUrl = "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54221_64bit/strawberry-perl-5.42.2.1-64bit-portable.zip"
            $spZip = "$env:TEMP\strawberry-perl.zip"
            Invoke-WebRequest -Uri $spUrl -OutFile $spZip -TimeoutSec 300
            $spDest = Join-Path $env:RUNNER_TEMP 'Strawberry'
            Expand-Archive -Path $spZip -DestinationPath $spDest -Force
            Remove-Item $spZip -Force
            Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $spDest 'perl\bin')
            Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $spDest 'c\bin')
            # NASM for OpenSSL SIMD (warning only if missing, but nice to have)
            choco install nasm -y 2>$null | Out-Null
            # Prepend Strawberry Perl to PATH for THIS step so build_win.ps1 finds
            # it before Git for Windows' cygwin perl (which shadows it).
            $env:PATH = (Join-Path $spDest 'perl\bin') + ';' + (Join-Path $spDest 'c\bin') + ';' + $env:PATH
            # cache-path is the install directory inside the deps build directory.
            $deps = (Split-Path "${{ github.workspace }}/${{ inputs.cache-path }}").Replace('\', '/')
            # Use flags from matrix if provided, otherwise fall back to compiler-based logic
            $flags = @("${{ inputs.flags }}" -split '\s+' | Where-Object { $_ })
            if (-not $flags) {
              $flags = if ("${{ inputs.compiler }}" -eq "clang") { "-l", "-x" } else { "--msvc", "--msbuild" }
            }
            # Use build_win.ps1 by default; build_win.bat for baseline comparison
            if ("${{ inputs.script }}" -eq "bat") {
              $batArgs = @("-d", "--arch", "${{ inputs.arch }}", "--deps-dir", $deps) + $flags
              & "${{ github.workspace }}\build_win.bat" @batArgs
            } else {
              $useClangCl = $flags -contains "-l"
              $useNinja   = $flags -contains "-x"
              $useMsvc    = $flags -contains "--msvc"
              $useMsbuild = $flags -contains "--msbuild"
              $useCache   = if ($flags -contains "--ccache") { "ccache" } else { $null }
              # Bind the switch directly: splatting a string binds it positionally and breaks
              # parameter binding on build_win.ps1.
              & "${{ github.workspace }}\build_win.ps1" -Deps -Arch ${{ inputs.arch }} -DepsDir $deps -ClangCl:$useClangCl -Ninja:$useNinja -Msvc:$useMsvc -Msbuild:$useMsbuild -Cache:$useCache
            }
        shell: powershell

      - name: Build on Mac ${{ inputs.arch }}
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}
        run: |
            if [ -z "${{ vars.SELF_HOSTED }}" ]; then
              brew install automake texinfo libtool pkgconf yasm nasm
            fi
            ./build_release_macos.sh -dx ${{ !vars.SELF_HOSTED && '-j 3' || '' }} -a ${{ inputs.arch }} -t 10.15
            (cd "${{ github.workspace }}/deps/build/${{ inputs.arch }}" && \
            find . -mindepth 1 -maxdepth 1 ! -name 'OrcaSlicer_dep' -exec rm -rf {} +)


      - name: Apt-Install Dependencies
        if: runner.os == 'Linux' && !vars.SELF_HOSTED
        uses: ./.github/actions/apt-install-deps

      - name: Build on Ubuntu
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
            mkdir -p ${{ github.workspace }}/deps/build/destdir
            ./build_linux.sh -drlL
            cd deps/build
            tar -czvf OrcaSlicer_dep_ubuntu_$(date +"%Y%m%d").tar.gz destdir


      # Upload Windows deps artifact
      - name: Upload Windows deps artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: OrcaSlicer_dep_win_${{ inputs.arch }}_${{ env.date }}
          # cache-path already points at OrcaSlicer_dep; appending it again matched nothing.
          path: ${{ github.workspace }}/${{ inputs.cache-path }}/**

  build_orca:
    name: Build OrcaSlicer
    needs: [build_deps]
    if: ${{ !cancelled() && !inputs.build-deps-only && (inputs.force-build || (inputs.valid-cache == true && needs.build_deps.result == 'skipped') || (inputs.valid-cache != true && success())) }}
    uses: ./.github/workflows/build_orca.yml
    with:
      cache-key: ${{ inputs.cache-key }}
      cache-prefix: ${{ inputs.cache-prefix }}
      cache-path: ${{ inputs.cache-path }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
      compiler: ${{ inputs.compiler }}
      preset: ${{ inputs.preset }}
      flags: ${{ inputs.flags }}
      script: ${{ inputs.script }}
      clean: ${{ inputs.clean }}
    secrets: inherit

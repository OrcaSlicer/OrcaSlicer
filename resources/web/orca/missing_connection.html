<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Printer Connection Required</title>
<link rel="stylesheet" type="text/css" href="css/home.css" />
<script type="text/javascript">
// The host tags the UA with (dark)/(light) from the app theme; this page has no
// access to the data-orca-theme contract, so match the UA so it follows the app
// theme instead of the OS preference.
if (/\(dark\)/i.test(navigator.userAgent)) {
    document.documentElement.setAttribute('data-orca-theme', 'dark');
    document.write('<link rel="stylesheet" type="text/css" href="css/dark.css" />');
}
</script>
<script type="text/javascript" src="../include/i18n.js"></script>	
<script type="text/javascript" src="../include/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="../homepage/js/json2.js"></script>
<script type="text/javascript" src="../homepage/js/globalapi.js"></script>
<script type="text/javascript" src="../homepage/js/home.js"></script>
</head>
<body onLoad="OnInit()">
    <div class="container">
        <h1 data-i18n="printer_connection">Printer Connection</h1>
        <p data-i18n="printer_connection_setup">Please set up your printer connection to view the device.</p>
        <img src="setup_connection.gif" alt="Printer connection setup demonstration" style="max-width: 100%; height: auto; display: block;"/>
    </div>
</body>
</html>

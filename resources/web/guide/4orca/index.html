<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=7200" />
<title data-i18n="stealth_mode">Stealth Mode</title>
<link rel="stylesheet" type="text/css" href="../../include/global.css" />	<!-- ORCA One for all-->
<link rel="stylesheet" type="text/css" href="../css/common.css" />	
<link rel="stylesheet" type="text/css" href="../css/dark.css" />		
<link rel="stylesheet" type="text/css" href="4orca.css" />
<script type="text/javascript" src="../../include/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="../js/json2.js"></script>	
<script type="text/javascript" src="../../include/i18n.js"></script>	
<script type="text/javascript" src="../js/globalapi.js"></script>	
<script type="text/javascript" src="../../include/a11y.js"></script>
<script type="text/javascript" src="../js/common.js"></script>
<script type="text/javascript" src="4orca.js"></script>	
</head>
<body class="PlainButtons" onLoad="OnInit()">
<div id="Title">
	<h1 data-i18n="stealth_mode">Stealth Mode</h1>
</div>
<div id="Content">

    <div id="FeatureText">
		<div><a class="TextS1" data-i18n="stealth_mode_desc">This disables all cloud features, including Orca Cloud profile syncing. Users who prefer to work entirely offline can enable this option.</a></div>
			<br/>
			<div><a class="TextS2" data-i18n="stealth_mode_note">Note: When Stealth Mode is enabled, your user profiles will not be backed up to Orca Cloud.</a></div>
    </div>
	
	
	<!-- ORCA use label tag to allow checkbox to toggle when user clicked to text -->
	<label id="CheckArea"><input id="StealthMode" onClick="SendStealthModeCheck()" type="checkbox"><a class="TextS1" data-i18n="enable_stealth_mode">Enable Stealth Mode.</a></label>
	<div id="RestartText"></div>
	
</div>
<div id="AcceptArea">
	<button type="button" class="ButtonStyleRegular ButtonTypeChoice" id="PreBtn" onclick="window.history.back()" data-i18n="back">Back</button>
	<button type="button" class="ButtonStyleConfirm ButtonTypeChoice" id="GotoNetPluginBtn" onclick="GotoNetPluginPage()" data-i18n="next">Next</button>
</div>	
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=7200" />
<title data-i18n="login_region">Please select your login region</title>
<link rel="stylesheet" type="text/css" href="../../include/global.css" />	<!-- ORCA One for all-->
<link rel="stylesheet" type="text/css" href="../css/common.css" />		
<link rel="stylesheet" type="text/css" href="11.css" />
<link rel="stylesheet" type="text/css" href="../css/dark.css" />	
<script type="text/javascript" src="../../include/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="../js/json2.js"></script>	
<script type="text/javascript" src="../../include/i18n.js"></script>	
<script type="text/javascript" src="../js/globalapi.js"></script>	
<script type="text/javascript" src="../../include/a11y.js"></script>
<script type="text/javascript" src="../js/common.js"></script>
<script type="text/javascript" src="11.js"></script>		
</head>
<body class="PlainButtons" onLoad="OnInit()">
<div id="Title">
	<h1 data-i18n="login_region">Please select your login region</h1>
</div>
<div id="Content">
	<div id="EarthIcon"><img src="earth.png" alt=""/></div>
	<div id="RegionList" role="radiogroup" aria-label="Login region" data-i18n-aria-label="login_region_group">
		<label class="RegionItem RegionSelected TextS1" region="Asia-Pacific" data-i18n="asia_pacific"><input type="radio" name="region" class="A11yOnly" onchange="ChooseRegion('Asia-Pacific')" checked />Asia-Pacific</label>
		<label class="RegionItem" region="China" data-i18n="china"><input type="radio" name="region" class="A11yOnly" onchange="ChooseRegion('China')" />China</label>
		<label class="RegionItem" region="Europe" data-i18n="europe"><input type="radio" name="region" class="A11yOnly" onchange="ChooseRegion('Europe')" />Europe</label>
		<label class="RegionItem" region="North America" data-i18n="north_america"><input type="radio" name="region" class="A11yOnly" onchange="ChooseRegion('North America')" />North America</label>
		<label class="RegionItem" region="Others" data-i18n="others"><input type="radio" name="region" class="A11yOnly" onchange="ChooseRegion('Others')" />Others</label>
	</div>
<!--	<div id="ChangeTip">
		<div><img class="TipIcon" src="tip.png" /></div>
		<div tid="t63">After changing the region, your account will be logged out. Please log in again later.</div>
	</div>-->
</div>
<div id="AcceptArea">
	<button type="button" class="ButtonStyleConfirm ButtonTypeChoice" id="AcceptBtn" onclick="GotoPolicyPage()" data-i18n="next">Next</button>
</div>	
</body>
</html>

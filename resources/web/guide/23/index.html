<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=0" />
<title data-i18n="filament_selection">Filament Selection</title>
<link rel="stylesheet" type="text/css" href="../../include/global.css" />	<!-- ORCA One for all-->
<link rel="stylesheet" type="text/css" href="../css/common.css" />	
<link rel="stylesheet" type="text/css" href="../22/common.css" /> <!-- ORCA use common sources for setup guide and standalone dialog -->
<link rel="stylesheet" type="text/css" href="23.css" />
<link rel="stylesheet" type="text/css" href="../css/dark.css" />	
<script type="text/javascript" src="../../include/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="../js/json2.js"></script>	
<script type="text/javascript" src="../../include/i18n.js"></script>	
<script type="text/javascript" src="../js/globalapi.js"></script>	
<script type="text/javascript" src="../../include/a11y.js"></script>
<script type="text/javascript" src="../js/common.js"></script>
<script type="text/javascript" src="../22/common.js"></script> <!-- ORCA use common sources for setup guide and standalone dialog -->
<script type="text/javascript" src="./23.js"></script>	
</head>
<body class="PlainButtons" onLoad="OnInit()">
<div id="Title">
	<h1 class="A11yOnly" data-i18n="filament_selection">Filament Selection</h1>
	<button type="button" id="SystemFilamentBtn" class="TitleSelected" onClick="OnSelectMenu(1)" aria-pressed="true" data-i18n="system_filaments">System Filaments</button>
	<button type="button" id="CustomFilamentBtn" class="TitleUnselected" onClick="OnSelectMenu(2)" aria-pressed="false" data-i18n="custom_filaments">Custom Filaments</button>
</div>
<div id="Content" class="ZScrol">

<div id="SystemFilamentsArea">

<!-- ORCA column browser -->
<div class="cbr-browser-container">
	<div class="cbr-column">
		<!-- ORCA hidden column headings: the visible titles are placeholders -->
		<h2 class="A11yOnly" data-i18n="printers">Printers</h2>
		<div class="cbr-column-title-container">
			<div class="search-icon"></div>
			<input type="text" class="cbr-search-bar" placeholder=" " aria-labelledby="MachineSearchLabel"/>
			<span class="cbr-search-placeholder" id="MachineSearchLabel" aria-hidden="true" data-i18n="printer">Printer</span>
			<div class="clear-icon" aria-hidden="true"></div>
		</div>
		<div class="cbr-content thin-scroll" id="MachineList">
			<div class="CValues">
				<label><input type="checkbox" mode="all" onClick="ChooseAllMachine()" checked /><span data-i18n="all">All</span></label>
			</div>
			<div class="cbr-no-items" data-i18n="no_items">No items</div>
		</div>
	</div>

	<div class="cbr-column">
		<h2 class="A11yOnly" data-i18n="filament_types">Filament types</h2>
		<div class="cbr-column-title-container">
			<div class="search-icon"></div>
			<input type="text" class="cbr-search-bar" placeholder=" " aria-labelledby="FilatypeSearchLabel"/>
			<span class="cbr-search-placeholder" id="FilatypeSearchLabel" aria-hidden="true" data-i18n="filament_type">Filament type</span>
			<div class="clear-icon" aria-hidden="true"></div>
		</div>
		<div class="cbr-content thin-scroll" id="FilatypeList">
			<div class="CValues">
				<label><input type="checkbox" onClick="ChooseAllFilament()" checked /><span data-i18n="all">All</span></label>
			</div>
			<div class="cbr-no-items" data-i18n="no_items">No items</div>
		</div>
	</div>

	<div class="cbr-column">
		<h2 class="A11yOnly" data-i18n="vendors">Vendors</h2>
		<div class="cbr-column-title-container">
			<div class="search-icon"></div>
			<input type="text" class="cbr-search-bar" placeholder=" " aria-labelledby="VendorSearchLabel"/>
			<span class="cbr-search-placeholder" id="VendorSearchLabel" aria-hidden="true" data-i18n="vendor">Vendor</span>
			<div class="clear-icon" aria-hidden="true"></div>
		</div>
		<div class="cbr-content thin-scroll" id="VendorList">
			<div class="CValues">
				<label><input type="checkbox" onClick="ChooseAllVendor()" checked /><span data-i18n="all">All</span></label>
			</div>
			<div class="cbr-no-items" data-i18n="no_items">No items</div>
		</div>
	</div>

	<div class="cbr-column">
		<h2 class="A11yOnly" data-i18n="filaments">Filaments</h2>
		<div class="cbr-column-title-container">
			<div class="cbr-filter-box">
				<div class="filter-icon"></div>
				<input type="text" class="cbr-filter-bar" placeholder=" " aria-labelledby="FilterLabel"/>
				<span class="cbr-filter-placeholder" id="FilterLabel" aria-hidden="true" data-i18n="filter_items">Filter items</span>
				<div class="clear-icon" aria-hidden="true"></div>
			</div>
			<div class="ComboBox NoLabel">
				<div class="arrow-icon"></div>
				<select id="filter-tags" aria-label="Filter by state" data-i18n-aria-label="filter_by_state">
					<option value="0" disabled selected hidden></option>
					<option value="1" data-i18n="checked">Checked</option>
					<option value="2" data-i18n="unchecked">Unchecked</option>
				</select>
			</div>
			<!-- ORCA "13 / 289 [16]" reads as bare numbers, so a hidden twin says what they count, and announces each change -->
			<div class="list-item-count" aria-hidden="true"></div>
			<span class="A11yOnly" id="FilamentCountText" role="status"></span>
			<div class="cbr-filter-btns">
				<span class="cbr-filter-mode-filter" data-i18n="select_filtered">Select filtered</span>
				<span class="cbr-filter-mode-visible" data-i18n="select_visible">Select visible</span>
				<button type="button" class="ButtonStyleConfirm ButtonTypeWindow" aria-label="Select all shown filaments" data-i18n-aria-label="select_all_shown" onClick="SelectAllFilament(1)" data-i18n="all">All</button>
				<button type="button" class="ButtonStyleRegular ButtonTypeWindow" aria-label="Clear all shown filaments" data-i18n-aria-label="clear_all_shown" onClick="SelectAllFilament(0)" data-i18n="clear_all">Clear all</button>
			</div>	
		</div>
		<div class="cbr-content thin-scroll" id="ItemBlockArea">
			<!-- <label class="MItem"><input type="checkbox" class="trans" tid="t11" onClick="SelectAllFilament()" /><span class="trans" tid="t11">all</span></label> -->
			<div class="cbr-no-items" data-i18n="no_items">No items</div>
		</div>
	</div>
</div>

</div>
	
<div id="CustomFilamentsArea">
	<div id="CFilament_Btn_Area">
		<button type="button" class="ButtonStyleConfirm ButtonTypeWindow" onClick="OnClickCustomFilamentAdd()" data-i18n="create_new">Create New</button>
	</div>
    <div id="CFilament_List" class="thin-scroll">
	</div>
</div>

</div>
<div id="AcceptArea">
	<button type="button" class="ButtonStyleConfirm ButtonTypeChoice" id="AcceptBtn" onclick="ConfirmSelect()" data-i18n="confirm">Confirm</button>
	<button type="button" class="ButtonStyleRegular ButtonTypeChoice" id="PreBtn" onclick="CancelSelect()" data-i18n="cancel">Cancel</button>
</div>
	<dialog id="NoticeBody" role="alertdialog" aria-labelledby="NoticeBar" aria-describedby="NoticeText NoticeText2">
	<div id="NoticeBar" data-i18n="error">Error</div>
	<div id="NoticeContent">
	<div id="NoticeText" data-i18n="filament_required">At least one filament must be selected.</div>
	<div id="NoticeText2" data-i18n="use_default_filament">Do you want to use the default filament?</div>
	<div id="NoticeBtns">
		<button type="button" class="ButtonStyleConfirm ButtonTypeChoice" onClick="ChooseDefaultFilament()" data-i18n="yes">Yes</button>
		<button type="button" class="ButtonStyleRegular ButtonTypeChoice" onClick="ShowNotice(0)" data-i18n="no">No</button>
	</div>
	</div>
	</dialog>

</body>
<script>
	document.onkeydown = function (event) {
		var e = event || window.event || arguments.callee.caller.arguments[0];

		if (e.keyCode == 27)
			ClosePage();

		//if (window.event) {
		//	try { e.keyCode = 0; } catch (e) { }
		//	e.returnValue = false;
		//}
	};
    window.addEventListener('wheel', function (event) {
        if (event.ctrlKey === true || event.metaKey) {
            event.preventDefault();
        }
    }, { passive: false });

	initInputEvents();
</script>
</html>

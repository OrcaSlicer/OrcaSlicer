<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=7200" />
<title data-i18n="printer_selection">Printer Selection</title>

<link rel="stylesheet" type="text/css" href="../css/common.css" />

<script type="text/javascript" src="../../include/jquery-3.6.0.min.js"></script>

<script type="text/javascript" src="../../include/i18n.js"></script>	
<script type="text/javascript" src="../js/globalapi.js"></script>	
<script type="text/javascript" src="../../include/a11y.js"></script>
<script type="text/javascript" src="../js/common.js"></script>
<script type="text/javascript" src="../21/common.js"></script> <!-- ORCA use common sources for setup guide and standalone dialog -->
<script type="text/javascript" src="24.js"></script>	
</head>
<body class="PlainButtons" onLoad="OnInit()">
<div id="Title">
	<h1 data-i18n="printer_selection">Printer Selection</h1>
</div>

<div id="SidebarContainer" role="dialog" aria-modal="true" aria-labelledby="SidebarTitle">
	<div id="Sidebar" class="thin-scroll">
		<div class="SidebarHeader">
			<h2 class="title" id="SidebarTitle" data-i18n="vendors">Vendors</h2>
			<button type="button" class="SidebarClose ButtonStyleRegular" data-i18n="close" onclick="SetSidebarOpen(0)">Close</button>
		</div>
		<ul class="area" id="SidebarVendors">
			<!-- <li><button type="button" class="SidebarItem"></button></li> -->
		</ul>
	</div>
	<div class="back" aria-hidden="true" onclick="SetSidebarOpen(0)"></div>
</div>
<button type="button" class="SidebarBtn ButtonStyleRegular" aria-haspopup="dialog" aria-label="Jump to vendor" data-i18n-aria-label="jump_to_vendor" onclick="SetSidebarOpen(1)">
	<div class="icon16"></div>
</button>

<div class="search" hasvalue="0">
	<div class="search-icon icon16"></div>
	<input type="text" class="searchTerm" placeholder=" " oninput="textInput(this)" aria-labelledby="SearchLabel">
	<span class="search-placeholder" id="SearchLabel" aria-hidden="true" data-i18n="search">Search</span>
</div>
<span class="A11yOnly" id="SearchCountText" role="status"></span>
<div class="LayoutSelector">
	<div class="TabGroup">
		<button type="button" class="TabButton" aria-pressed="false" aria-label="Compact list view" data-i18n-aria-label="view_compact_list" onclick="LayoutMode('compact-list')" ><div class="icon16"></div></button>
		<button type="button" class="TabButton" aria-pressed="false" aria-label="Compact cover view" data-i18n-aria-label="view_compact_cover" onclick="LayoutMode('compact-cover')"><div class="icon16"></div></button>
		<button type="button" class="TabButton" aria-pressed="true" aria-label="Large cover view" data-i18n-aria-label="view_large_cover" onclick="LayoutMode('large-cover')"  ><div class="icon16"></div></button>
	</div>
</div>

<div id="Content"  class="thin-scroll">

<!-- EXAMPLE GENERATED CODE BLOCK
<div class="OneVendorBlock" Vendor="VendorName">
	<div class="BlockBanner">
		<a>VendorName</a>
			<div class="BannerBtns" onClick="ChooseVendor('VendorName')" >
				<div class="modelCount"></div>
				<input type="checkbox" class="VendorCheckbox" />
			</div>
	</div>
	<div class="PrinterArea">

			<img class="ModelThumbnail" src="CoverPath" />
			</div>

				<div class="title trans">Nozzle</div>
				<div class="value">nozzleInfo</div>
			</div>
			<div style="display: flex;">
				<div class="ModelCheckBox" vendor="' +vendor+ '" model="'+OneModel['model']+'"></div>
				<div class="PName">modelName</div>
			</div>
		</div>
	</div>
</div>
-->

</div>
<div id="AcceptArea">
	<button type="button" class="ButtonStyleRegular ButtonTypeChoice" id="CreateBtn" onclick="CreateNewPrinter()" data-i18n="create">Create</button>
	<button type="button" class="ButtonStyleRegular ButtonTypeChoice" id="CheckNewPrintersBtn" onclick="CheckForNewPrinters()" data-i18n="check_new_printers">Check for new printers</button>
	<button type="button" class="ButtonStyleConfirm ButtonTypeChoice" id="AcceptBtn" onclick="ConfirmSelect()" data-i18n="confirm">Confirm</button>
	<button type="button" class="ButtonStyleRegular ButtonTypeChoice" id="PreBtn" onclick="CancelSelect()" data-i18n="cancel">Cancel</button>
</div>

<dialog id="NoticeBody" role="alertdialog" aria-labelledby="NoticeBar" aria-describedby="NoticeText">
	<div id="NoticeBar" data-i18n="error">Error</div>
	<div id="NoticeContent">
	<div id="NoticeText" data-i18n="printer_required">At least one printer must be selected.</div>
	<div id="NoticeBtns">
		<button type="button" class="ButtonStyleConfirm ButtonTypeChoice" onClick="ShowNotice(0)" data-i18n="ok">OK</button>
	</div>
	</div>
</dialog>

</body>
<script>
	initKeyEvents(true); // close on ESC
	InitGlobalVariables();
</script>
</html>

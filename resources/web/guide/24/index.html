	<div data-i18n="printer_selection">Printer Selection</div>
</div>

	<div id="Sidebar" class="thin-scroll">

		<div class="area" id="SidebarVendors">
			<!-- <div class="SidebarItem"></div> -->
		</div>
	</div>
	<div class="back" onclick="document.getElementById('SidebarContainer').setAttribute('open', '0')"></div>
</div>
<div class="SidebarBtn ButtonStyleRegular" onclick="document.getElementById('SidebarContainer').setAttribute('open', '1')">
	<div class="icon16"></div>
</div>

<div class="search" hasvalue="0">
	<div class="search-icon icon16"></div>
	<input type="text" class="searchTerm" placeholder=" " oninput="textInput(this)">
	<span class="search-placeholder" data-i18n="search">Search</span>
</div>
<div class="LayoutSelector">
	<div class="TabGroup">
		<div class="TabButton" onclick="LayoutMode('compact-list')" ><div class="icon16"></div></div>
		<div class="TabButton" onclick="LayoutMode('compact-cover')"><div class="icon16"></div></div>
		<div class="TabButton" onclick="LayoutMode('large-cover')"  ><div class="icon16"></div></div>
	</div>
</div>

<div id="AcceptArea">
	<div class="ButtonStyleRegular ButtonTypeChoice" id="CreateBtn" onclick="CreateNewPrinter()" data-i18n="create">Create</div>
	<div class="ButtonStyleRegular ButtonTypeChoice" id="CheckNewPrintersBtn" onclick="CheckForNewPrinters()" data-i18n="check_new_printers">Check for new printers</div>
	<div class="ButtonStyleConfirm ButtonTypeChoice" id="AcceptBtn" onclick="ConfirmSelect()" data-i18n="confirm">Confirm</div>
	<div class="ButtonStyleRegular ButtonTypeChoice" id="PreBtn" onclick="CancelSelect()" data-i18n="cancel">Cancel</div>
</div>
	
<div id="NoticeMask"></div>
<div id="NoticeBody">
	<div id="NoticeBar" data-i18n="error">Error</div>
	<div id="NoticeContent">
	<div id="NoticeText" data-i18n="printer_required">At least one printer must be selected.</div>
	<div id="NoticeBtns">
		<div class="ButtonStyleConfirm ButtonTypeChoice" onClick="ShowNotice(0)" data-i18n="ok">OK</div>

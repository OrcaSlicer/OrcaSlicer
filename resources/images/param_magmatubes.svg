<?xml version="1.0" encoding="UTF-8"?><svg id="a" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Upper U-tube (shorter, higher stagger level) with window gaps -->
  <line x1="5" y1="6" x2="5" y2="9" style="stroke:#009688; stroke-width:1.5; stroke-linecap:round;"/>
  <!-- window gap at y=9-11 (no stroke) -->
  <line x1="5" y1="11" x2="5" y2="14" style="stroke:#009688; stroke-width:1.5; stroke-linecap:round;"/>
  <path d="M5,14 C5,16.5 9,16.5 9,14" style="fill:none; stroke:#009688; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;"/>
  <line x1="9" y1="14" x2="9" y2="11" style="stroke:#009688; stroke-width:1.5; stroke-linecap:round;"/>
  <!-- window gap at y=9-11 -->
  <line x1="9" y1="9" x2="9" y2="6" style="stroke:#009688; stroke-width:1.5; stroke-linecap:round;"/>

  <!-- Lower U-tube (taller, lower stagger level) with window gaps at different Z -->
  <line x1="13" y1="8" x2="13" y2="12" style="stroke:#009688; stroke-width:1.5; stroke-linecap:round;"/>
  <!-- window gap at y=12-14 -->
  <line x1="13" y1="14" x2="13" y2="20" style="stroke:#009688; stroke-width:1.5; stroke-linecap:round;"/>
  <path d="M13,20 C13,22.5 17,22.5 17,20" style="fill:none; stroke:#009688; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;"/>
  <line x1="17" y1="20" x2="17" y2="14" style="stroke:#009688; stroke-width:1.5; stroke-linecap:round;"/>
  <!-- window gap at y=12-14 -->
  <line x1="17" y1="12" x2="17" y2="8" style="stroke:#009688; stroke-width:1.5; stroke-linecap:round;"/>

  <!-- Window gap indicators (small dots showing the gap) -->
  <circle cx="5" cy="10" r="0.5" style="fill:#009688; opacity:0.4;"/>
  <circle cx="9" cy="10" r="0.5" style="fill:#009688; opacity:0.4;"/>
  <circle cx="13" cy="13" r="0.5" style="fill:#009688; opacity:0.4;"/>
  <circle cx="17" cy="13" r="0.5" style="fill:#009688; opacity:0.4;"/>

  <!-- Isometric box frame -->
  <rect x="1.5" y="4.5" width="18" height="18" rx="2" ry="2" transform="translate(21 27) rotate(-180)" style="fill:none; stroke:#949494; stroke-linecap:round; stroke-linejoin:round;"/>
  <path d="M2.09,5.09l2.66-2.66c.6-.6,1.4-.93,2.24-.93h13.51c1.1,0,2,.9,2,2v13.51c0,.84-.33,1.65-.93,2.24l-2.66,2.66" style="fill:none; stroke:#949494; stroke-linecap:round; stroke-linejoin:round;"/>
  <line x1="18.91" y1="5.09" x2="21.91" y2="2.09" style="fill:none; stroke:#949494; stroke-linecap:round; stroke-linejoin:round;"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?><svg id="a" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Syringe/nozzle injecting downward into a U-tube -->
  <!-- Nozzle tip pointing down -->
  <rect x="9.5" y="2" width="3" height="6" rx="0.5" style="fill:#FF1900; stroke:#CC1400; stroke-width:0.5;"/>
  <polygon points="9.5,8 12.5,8 11,11" style="fill:#FF1900; stroke:#CC1400; stroke-width:0.5; stroke-linejoin:round;"/>
  <!-- Droplet -->
  <circle cx="11" cy="13" r="1.2" style="fill:#FF4500; opacity:0.8;"/>
  <!-- U-tube channel being filled -->
  <path d="M7,11 L7,19 C7,21 9,21 9,19 L9,14" style="fill:none; stroke:#FF1900; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:0.6;"/>
  <path d="M13,14 L13,19 C13,21 15,21 15,19 L15,11" style="fill:none; stroke:#FF1900; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:0.6;"/>
  <!-- U-bottom connection -->
  <path d="M7,19 C7,22 15,22 15,19" style="fill:none; stroke:#FF1900; stroke-width:2; stroke-linecap:round; opacity:0.6;"/>
  <!-- Isometric box frame -->
  <rect x="1.5" y="4.5" width="18" height="18" rx="2" ry="2" transform="translate(21 27) rotate(-180)" style="fill:none; stroke:#949494; stroke-linecap:round; stroke-linejoin:round;"/>
  <path d="M2.09,5.09l2.66-2.66c.6-.6,1.4-.93,2.24-.93h13.51c1.1,0,2,.9,2,2v13.51c0,.84-.33,1.65-.93,2.24l-2.66,2.66" style="fill:none; stroke:#949494; stroke-linecap:round; stroke-linejoin:round;"/>
  <line x1="18.91" y1="5.09" x2="21.91" y2="2.09" style="fill:none; stroke:#949494; stroke-linecap:round; stroke-linejoin:round;"/>
</svg>

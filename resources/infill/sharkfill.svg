<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1260" width="1500" height="1260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sharkfill - continuous-line shark tessellation</title>
  <defs>
    <!-- One nozzle stroke: starts at a shark's tail tip and ends at the next shark's tail tip
         (along the lattice diagonal), so copies join end-to-start into unbroken lines. -->
    <path id="unit" d="M25.5 213.5 L61.7 130.3 L34.7 47.1 L87.2 95.7 L180 83.7 L241.6 32 L284 85.2 L479.3 85.7 L444.6 125.3 L434.5 117.3 L423.7 125.3 L412.2 117.3 L402.1 125.3 L391.3 117.3 L381.3 125.3 L371.2 117.3 L360.4 125.3 L349.6 117.3 L334.2 136.3 L349.6 156.4 L360.4 149.4 L371.2 157.4 L381.3 149.4 L391.3 157.4 L402.1 149.4 L412.2 157.4 L423.7 149.4 L434.5 157.4 L443 149.4 L450 158.4 L444.6 168.4 L297.9 167.4 L237.7 228.5 L232.3 176.9 L80.7 167.1 L25.5 213.5 L80.7 167.1 L180 83.7 L241.6 32 L275.5 3.5"/>
    <pattern id="tiles" width="500" height="420" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#3a3a3a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
        <use href="#unit" x="-250" y="-210"/>
        <use href="#unit" x="250" y="-210"/>
        <use href="#unit" x="0" y="0"/>
        <use href="#unit" x="-250" y="210"/>
        <use href="#unit" x="250" y="210"/>
        <use href="#unit" x="0" y="420"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>
  <rect width="100%" height="100%" fill="url(#tiles)"/>
</svg>

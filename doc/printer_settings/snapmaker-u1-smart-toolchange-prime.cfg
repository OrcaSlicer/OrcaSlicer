# Smart tool change prime for the Snapmaker U1.
#
# The slicer only knows its own time estimate, so it can't see a pause pressed on the printer,
# a filament runout or a long reheat. This macro times each tool's park on the printer instead,
# with print_stats.total_duration (real time since the print started, pauses included).
#
# Install: add this file to the printer's Klipper config (for example extended/klipper/ on the
# extended firmware) and restart Klipper. Then turn on "Time primes on the printer" in the
# slicer's process settings (Multimaterial > Tool change priming). Without the macro the printer
# only logs "Unknown command" and does not prime, so turn it on only after installing it.
#
# Called by the slicer after each tool change:
#   SMART_TOOLCHANGE_PRIME TOOL=<new> PREV=<old> FIRST=<0|1> RESTORE=<mm> MIN=<mm> MAX=<mm> IDLE=<s> SKIP=<s> SPEED=<mm/min> TEMP=<C>
#
# - RESTORE is the tool change retraction still in the new tool. It is always extruded in the chute first,
#   because the slicer counts it as restored and will not unretract on the part.
# - A tool's first use in a print (FIRST=1) is primed by SM_PRINT_PREEXTRUDE_FILAMENT, as in the stock tool change.
# - A tool parked for at least IDLE seconds has cooled down on standby and gets MAX; a shorter park gets MIN.
# - Parks shorter than SKIP seconds get no prime, only the restore.
# - A tool parked across any pause gets MAX: the stock pause cools every nozzle to 40C.
# - Any later tool was parked earlier in the same print, so its stored park time is always current.
# - Like the stock pre-extrusion, the prime ends with a 0.5 mm retraction, the cut and wipe, and a move out of
#   the chute Y first, inside SAVE_GCODE_STATE/RESTORE_GCODE_STATE.

[gcode_macro SMART_TOOLCHANGE_PRIME]
description: Prime the new tool into the purge chute, sized by how long it was really parked
# Per tool: total_duration when it was parked, and the paused time at that moment.
variable_parked_at: [-1.0, -1.0, -1.0, -1.0]
variable_paused_at: [0.0, 0.0, 0.0, 0.0]
gcode:
    {% set tool = params.TOOL|int %}
    {% set prev = params.PREV|default(-1)|int %}
    {% set first = params.FIRST|default(0)|int != 0 %}
    {% set restore = params.RESTORE|default(0)|float %}
    {% set min_len = params.MIN|default(2)|float %}
    {% set max_len = params.MAX|default(20)|float %}
    {% set full_idle = params.IDLE|default(60)|float %}
    {% set skip = params.SKIP|default(0)|float %}
    {% set speed = params.SPEED|default(360)|float %}
    {% set temp = params.TEMP|default(0)|float %}
    {% set now = printer.print_stats.total_duration|float %}
    # total_duration - print_duration only grows while the print is paused.
    {% set paused = now - printer.print_stats.print_duration|float %}
    {% set known = tool >= 0 and tool < parked_at|length %}
    {% set since = parked_at[tool]|float if known else -1.0 %}
    {% set paused_since = paused_at[tool]|float if known else 0.0 %}

    {% if prev >= 0 and prev < parked_at|length %}
        {% set parked = parked_at|list %}
        {% set pauses = paused_at|list %}
        {% set _ = parked.__setitem__(prev, now) %}
        {% set _ = pauses.__setitem__(prev, paused) %}
        SET_GCODE_VARIABLE MACRO=SMART_TOOLCHANGE_PRIME VARIABLE=parked_at VALUE=[{parked|join(',')}]
        SET_GCODE_VARIABLE MACRO=SMART_TOOLCHANGE_PRIME VARIABLE=paused_at VALUE=[{pauses|join(',')}]
    {% endif %}

    {% if first %}
        {% set length = 0.0 %}
        {% set reason = 'first use, primed by pre-extrusion' %}
    {% else %}
        # A park time we can't trust (not recorded, or from a longer earlier print) gets a full prime.
        {% set unknown = since < 0 or since > now %}
        {% set idle = 0.0 if unknown else now - since %}
        {% set after_pause = paused > paused_since + 0.5 %}
        {% if unknown or after_pause or idle >= full_idle %}
            {% set length = max_len %}
        {% elif idle < skip %}
            {% set length = 0.0 %}
        {% else %}
            {% set length = min_len %}
        {% endif %}
        {% set reason = 'park time unknown' if unknown else ('parked %.0fs' % idle) ~ (' across a pause' if after_pause else '') %}
    {% endif %}

    {% if restore <= 0 and length <= 0 %}
        RESPOND TYPE=echo MSG="Smart prime T{tool}: {reason}, nothing to prime"
    {% else %}
        RESPOND TYPE=echo MSG="Smart prime T{tool}: {reason}, restore {'%.2f' % restore}mm, prime {'%.2f' % length}mm"
        SAVE_GCODE_STATE NAME=smart_toolchange_prime
        {% if temp > 0 %}
            M109 T{tool} S{temp}
        {% endif %}
        MOVE_TO_DISCARD_FILAMENT_POSITION
        M83
        {% if restore > 0 %}
            G1 E{'%.3f' % restore} F{speed}
        {% endif %}
        {% if length > 0 %}
            G1 E{'%.3f' % length} F{speed}
        {% endif %}
        G1 E-0.5
        INNER_CUTOFF_BASE_DISCARD
        INNER_ROUGHLY_CLEAN_NOZZLE_BASE_DISCARD ACTION=1
        MOVE_TO_XY_IDLE_POSITION_EXTRUDER
        RESTORE_GCODE_STATE NAME=smart_toolchange_prime
    {% endif %}
